name: Notebook validation

on:
  pull_request:
    paths:
      - "code/eda_real_estate.ipynb"
      - "code/real_estate_model.ipynb"
      - "code/fetch_macroeconomic_data.py"
      - "data/scraped_real_estate_model_features.csv"
      - "data/scraped_real_estate_training.csv"
      - "data/macroeconomic_indicators.csv"
      - "requirements.txt"
      - ".github/workflows/model-validation.yml"
  push:
    branches:
      - main
    paths:
      - "code/eda_real_estate.ipynb"
      - "code/real_estate_model.ipynb"
      - "code/fetch_macroeconomic_data.py"
      - "data/scraped_real_estate_model_features.csv"
      - "data/scraped_real_estate_training.csv"
      - "data/macroeconomic_indicators.csv"
      - "requirements.txt"
      - ".github/workflows/model-validation.yml"

jobs:
  validate-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Execute both notebooks end to end
        env:
          MPLBACKEND: Agg
        run: >-
          python -m jupyter nbconvert
          --execute
          --to notebook
          --inplace
          --ExecutePreprocessor.timeout=900
          code/eda_real_estate.ipynb
          code/real_estate_model.ipynb

